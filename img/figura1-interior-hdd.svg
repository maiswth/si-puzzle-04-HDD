<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Figura 1: Interior del HDD</title>
  <desc id="d">Vista cenital de un disco duro abierto, sin tapa, con platos, motor del eje, brazo actuador y cabezal de lectura/escritura. Incluye la placa controladora dibujada aparte y un recuadro ampliado con una pista y un sector resaltados.</desc>

  <defs>
    <linearGradient id="g-housing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#cfd8e0"/>
    </linearGradient>
    <linearGradient id="g-platter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d9e1e8"/>
      <stop offset="0.65" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b9c4ce"/>
    </linearGradient>
    <radialGradient id="g-hub" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5b6672"/>
      <stop offset="1" stop-color="#1f2730"/>
    </radialGradient>
    <linearGradient id="g-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8794a1"/>
      <stop offset="1" stop-color="#55616d"/>
    </linearGradient>
    <linearGradient id="g-pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f83"/>
      <stop offset="1" stop-color="#1f6b62"/>
    </linearGradient>
    <linearGradient id="g-zoom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#c3cdd6"/>
    </linearGradient>
    <clipPath id="clip-zoom">
      <rect x="690" y="400" width="270" height="220" rx="8"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a5662"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="780" fill="#f7f9fb"/>

  <!-- Título -->
  <text x="40" y="32" font-size="18" font-weight="700" fill="#1f2730">Figura 1: Interior del HDD</text>
  <text x="330" y="32" font-size="13" fill="#5b6672">Vista cenital, sin tapa</text>

  <!-- ============ CARCASA ============ -->
  <g id="carcasa">
    <rect x="40" y="50" width="600" height="520" rx="22" fill="url(#g-housing)" stroke="#8a97a4" stroke-width="2"/>
    <rect x="52" y="62" width="576" height="496" rx="14" fill="none" stroke="#aab5c0" stroke-width="1" stroke-dasharray="4 4"/>
    <g fill="#8a97a4" stroke="#5b6672" stroke-width="1">
      <circle cx="66" cy="76" r="6"/>
      <circle cx="614" cy="76" r="6"/>
      <circle cx="66" cy="544" r="6"/>
      <circle cx="614" cy="544" r="6"/>
    </g>
  </g>

  <!-- ============ PLATOS ============ -->
  <g id="platos">
    <circle cx="300" cy="310" r="210" fill="url(#g-platter)" stroke="#7d8996" stroke-width="2"/>
    <g fill="none" stroke="#7d8996" stroke-width="0.8" opacity="0.45">
      <circle cx="300" cy="310" r="200"/>
      <circle cx="300" cy="310" r="170"/>
      <circle cx="300" cy="310" r="150"/>
      <circle cx="300" cy="310" r="130"/>
      <circle cx="300" cy="310" r="110"/>
      <circle cx="300" cy="310" r="90"/>
    </g>
    <!-- Pista resaltada y sector resaltado -->
    <circle cx="300" cy="310" r="180" fill="none" stroke="#2b7de9" stroke-width="3" opacity="0.8"/>
    <path d="M371.9 483.7 A188 188 0 0 1 353.4 490.3 L348.9 474.9 A172 172 0 0 0 365.8 468.9 Z" fill="#f08a24" stroke="#c4650d" stroke-width="1"/>
    <!-- Lupa -->
    <circle cx="360" cy="480" r="22" fill="none" stroke="#4a5662" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- ============ MOTOR DEL EJE ============ -->
  <g id="motor-eje">
    <circle cx="300" cy="310" r="62" fill="#9aa7b4" stroke="#5b6672" stroke-width="1.5"/>
    <circle cx="300" cy="310" r="28" fill="url(#g-hub)" stroke="#1f2730" stroke-width="1.5"/>
    <circle cx="300" cy="310" r="9" fill="#9aa7b4" stroke="#1f2730" stroke-width="1"/>
    <g fill="#5b6672" stroke="#2a323b" stroke-width="0.8">
      <circle cx="345" cy="310" r="4"/>
      <circle cx="322.5" cy="349" r="4"/>
      <circle cx="277.5" cy="349" r="4"/>
      <circle cx="255" cy="310" r="4"/>
      <circle cx="277.5" cy="271" r="4"/>
      <circle cx="322.5" cy="271" r="4"/>
    </g>
  </g>

  <!-- ============ BRAZO ACTUADOR + CABEZAL ============ -->
  <g id="actuador" transform="translate(540 480) rotate(38.66)">
    <!-- Imán de la bobina de voz -->
    <rect x="20" y="-34" width="70" height="68" rx="8" fill="#2f3944" stroke="#1f2730" stroke-width="1.5"/>
    <!-- Bobina (cola del brazo) -->
    <path d="M0 -10 L60 -22 L60 22 L0 10 Z" fill="#c98a4b" stroke="#8a5a2a" stroke-width="1.2"/>
    <!-- Brazo -->
    <path id="brazo" d="M0 -10 L-150 -4 L-192 -2 L-192 2 L-150 4 L0 10 Z" fill="url(#g-arm)" stroke="#3d4853" stroke-width="1.5"/>
    <!-- Pivote -->
    <circle r="16" fill="#9aa7b4" stroke="#3d4853" stroke-width="1.5"/>
    <circle r="6" fill="#2f3944"/>
    <!-- Cabezal de lectura/escritura -->
    <rect id="cabezal" x="-206" y="-7" width="16" height="14" rx="2" fill="#e5484d" stroke="#8f1f24" stroke-width="1.2"/>
  </g>

  <!-- ============ CONEXIÓN A LA LUPA ============ -->
  <g stroke="#4a5662" stroke-width="1" stroke-dasharray="5 4" fill="none" opacity="0.8">
    <line x1="380" y1="470" x2="690" y2="400"/>
    <line x1="380" y1="490" x2="690" y2="620"/>
  </g>

  <!-- ============ RECUADRO AMPLIADO ============ -->
  <g id="detalle-ampliado">
    <text x="690" y="391" font-size="13" font-weight="600" fill="#1f2730">Detalle ampliado: pista y sector</text>
    <rect x="690" y="400" width="270" height="220" rx="8" fill="url(#g-zoom)"/>
    <g clip-path="url(#clip-zoom)">
      <g fill="none" stroke="#7d8996" stroke-width="18" opacity="0.28">
        <circle cx="825" cy="1000" r="396"/>
        <circle cx="825" cy="1000" r="420"/>
        <circle cx="825" cy="1000" r="444"/>
        <circle cx="825" cy="1000" r="468"/>
        <circle cx="825" cy="1000" r="516"/>
        <circle cx="825" cy="1000" r="540"/>
        <circle cx="825" cy="1000" r="564"/>
        <circle cx="825" cy="1000" r="588"/>
      </g>
      <!-- Pista resaltada -->
      <circle cx="825" cy="1000" r="492" fill="none" stroke="#2b7de9" stroke-width="18" opacity="0.55"/>
      <!-- Límites de sector -->
      <g stroke="#ffffff" stroke-width="2" opacity="0.8">
        <line x1="825" y1="1000" x2="825" y2="300" transform="rotate(-15 825 1000)"/>
        <line x1="825" y1="1000" x2="825" y2="300" transform="rotate(-9 825 1000)"/>
        <line x1="825" y1="1000" x2="825" y2="300" transform="rotate(-3 825 1000)"/>
        <line x1="825" y1="1000" x2="825" y2="300" transform="rotate(3 825 1000)"/>
        <line x1="825" y1="1000" x2="825" y2="300" transform="rotate(9 825 1000)"/>
        <line x1="825" y1="1000" x2="825" y2="300" transform="rotate(15 825 1000)"/>
      </g>
      <!-- Sector resaltado -->
      <path d="M799.78 499.69 A501 501 0 0 1 850.22 499.69 L850.28 517.66 A483 483 0 0 0 799.72 517.66 Z" fill="#f08a24" stroke="#c4650d" stroke-width="1.5"/>
    </g>
    <rect x="690" y="400" width="270" height="220" rx="8" fill="none" stroke="#4a5662" stroke-width="1.5"/>

    <!-- Etiquetas internas -->
    <g font-size="12" font-weight="600">
      <rect x="702" y="430" width="46" height="20" rx="4" fill="#ffffff" stroke="#2b7de9"/>
      <text x="725" y="444" text-anchor="middle" fill="#1b5fb8">Pista</text>
      <line x1="725" y1="450" x2="740" y2="515" stroke="#2b7de9" stroke-width="1.2"/>
      <circle cx="740" cy="515" r="2.5" fill="#2b7de9"/>

      <rect x="880" y="446" width="56" height="20" rx="4" fill="#ffffff" stroke="#c4650d"/>
      <text x="908" y="460" text-anchor="middle" fill="#a64f08">Sector</text>
      <line x1="900" y1="466" x2="842" y2="505" stroke="#c4650d" stroke-width="1.2"/>
      <circle cx="842" cy="505" r="2.5" fill="#c4650d"/>
    </g>
  </g>

  <!-- ============ PLACA CONTROLADORA (PCB), DIBUJADA APARTE ============ -->
  <g id="pcb">
    <text x="60" y="632" font-size="12" fill="#5b6672">Vista inferior: la PCB va en la cara externa de la carcasa y no se ve al abrir la tapa</text>
    <rect x="60" y="644" width="560" height="100" rx="8" fill="url(#g-pcb)" stroke="#144a43" stroke-width="2"/>
    <!-- Chips -->
    <rect x="90" y="664" width="90" height="60" rx="4" fill="#1f2730" stroke="#0e1318"/>
    <rect x="210" y="664" width="60" height="38" rx="3" fill="#2f3944" stroke="#0e1318"/>
    <rect x="290" y="664" width="60" height="38" rx="3" fill="#2f3944" stroke="#0e1318"/>
    <rect x="210" y="712" width="40" height="20" rx="3" fill="#c9d1d9" stroke="#7d8996"/>
    <rect x="262" y="712" width="40" height="20" rx="3" fill="#c9d1d9" stroke="#7d8996"/>
    <g fill="#e0b84d">
      <rect x="380" y="670" width="12" height="8" rx="1"/>
      <rect x="400" y="670" width="12" height="8" rx="1"/>
      <rect x="420" y="670" width="12" height="8" rx="1"/>
    </g>
    <!-- Pistas de cobre -->
    <g stroke="#8fd1c6" stroke-width="1.2" fill="none" opacity="0.7">
      <path d="M180 684 H210"/>
      <path d="M270 684 H290"/>
      <path d="M350 684 H380"/>
      <path d="M180 710 H210 V712"/>
    </g>
    <!-- Conector SATA -->
    <rect x="500" y="660" width="100" height="68" rx="4" fill="#e9eef3" stroke="#5b6672" stroke-width="1.5"/>
    <g fill="#c98a4b">
      <rect x="512" y="676" width="6" height="36"/>
      <rect x="524" y="676" width="6" height="36"/>
      <rect x="536" y="676" width="6" height="36"/>
      <rect x="548" y="676" width="6" height="36"/>
      <rect x="560" y="676" width="6" height="36"/>
      <rect x="572" y="676" width="6" height="36"/>
      <rect x="584" y="676" width="6" height="36"/>
    </g>
  </g>
  <!-- Flecha de montaje carcasa → PCB -->
  <line x1="600" y1="575" x2="600" y2="640" stroke="#4a5662" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ============ ETIQUETAS Y LÍNEAS DE GUÍA ============ -->
  <g id="etiquetas" stroke="#1f2730" stroke-width="1.3" fill="none">
    <!-- Platos -->
    <polyline points="430,200 690,110 700,110"/>
    <!-- Motor del eje -->
    <polyline points="324,298 690,180 700,180"/>
    <!-- Cabezal -->
    <polyline points="385,348 690,250 700,250"/>
    <!-- Brazo actuador -->
    <polyline points="470,424 690,320 700,320"/>
    <!-- PCB -->
    <polyline points="620,700 690,700 700,700"/>
  </g>
  <g fill="#1f2730">
    <circle cx="430" cy="200" r="3.5"/>
    <circle cx="324" cy="298" r="3.5"/>
    <circle cx="385" cy="348" r="3.5"/>
    <circle cx="470" cy="424" r="3.5"/>
    <circle cx="620" cy="700" r="3.5"/>
  </g>
  <g font-size="15" font-weight="600" fill="#1f2730">
    <text x="706" y="115">Platos</text>
    <text x="706" y="185">Motor del eje (spindle)</text>
    <text x="706" y="255">Cabezal de lectura/escritura</text>
    <text x="706" y="325">Brazo actuador</text>
    <text x="706" y="705">Placa controladora (PCB)</text>
  </g>
</svg>
