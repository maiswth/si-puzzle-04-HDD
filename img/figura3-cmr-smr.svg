<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Figura 3: CMR frente a SMR</title>
  <desc id="d">Corte transversal de las pistas en dos bandas. La banda superior (CMR) muestra cinco pistas rectangulares independientes, separadas por un pequeño hueco. La banda inferior (SMR) muestra cinco pistas solapadas parcialmente como tejas de tejado. Una de las pistas está marcada en rojo, con una flecha que apunta a las pistas siguientes y la nota: Reescribir esta pista obliga a reescribir las siguientes.</desc>

  <defs>
    <linearGradient id="g-track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbdec"/>
      <stop offset="1" stop-color="#6a98d8"/>
    </linearGradient>
    <linearGradient id="g-track-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0696d"/>
      <stop offset="1" stop-color="#cf3037"/>
    </linearGradient>
    <marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d6363d"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="880" height="580" fill="#f7f9fb"/>

  <!-- Título -->
  <text x="30" y="32" font-size="18" font-weight="700" fill="#1f2730">Figura 3: CMR frente a SMR</text>
  <text x="290" y="32" font-size="13" fill="#5b6672">Corte transversal de las pistas</text>

  <!-- ============ BANDA SUPERIOR: CMR ============ -->
  <g id="cmr">
    <rect x="30" y="60" width="820" height="240" rx="12" fill="#ffffff" stroke="#8a97a4" stroke-width="1.5"/>
    <text x="50" y="88" font-size="16" font-weight="700" fill="#1f2730">CMR: pistas independientes</text>
    <text x="300" y="88" font-size="12" fill="#5b6672">Conventional Magnetic Recording</text>

    <g id="cmr-pistas" fill="url(#g-track)" stroke="#2f5a9e" stroke-width="1.5">
      <rect x="100" y="108" width="455" height="28" rx="3"/>
      <rect x="100" y="144" width="455" height="28" rx="3"/>
      <rect x="100" y="180" width="455" height="28" rx="3"/>
      <rect x="100" y="216" width="455" height="28" rx="3"/>
      <rect x="100" y="252" width="455" height="28" rx="3"/>
    </g>

    <g font-size="11" fill="#5b6672" text-anchor="end">
      <text x="90" y="126">Pista 1</text>
      <text x="90" y="162">Pista 2</text>
      <text x="90" y="198">Pista 3</text>
      <text x="90" y="234">Pista 4</text>
      <text x="90" y="270">Pista 5</text>
    </g>

    <!-- Nota -->
    <rect x="602" y="170" width="238" height="60" rx="8" fill="#e9f7ef" stroke="#2e9e5b" stroke-width="1.3"/>
    <g font-size="12.5" fill="#1f7a45">
      <text x="616" y="196">Reescribir una pista no</text>
      <text x="616" y="214">afecta a las vecinas</text>
    </g>
  </g>

  <!-- ============ BANDA INFERIOR: SMR ============ -->
  <g id="smr">
    <rect x="30" y="330" width="820" height="210" rx="12" fill="#ffffff" stroke="#8a97a4" stroke-width="1.5"/>
    <text x="50" y="358" font-size="16" font-weight="700" fill="#1f2730">SMR: pistas solapadas</text>
    <text x="300" y="358" font-size="12" fill="#5b6672">Shingled Magnetic Recording</text>

    <!-- Pistas como tejas: cada una tapa parte de la anterior -->
    <g id="smr-pistas" stroke-width="1.5">
      <rect x="100" y="384" width="455" height="40" rx="3" fill="url(#g-track)" stroke="#2f5a9e"/>

      <rect x="100" y="403" width="455" height="5" fill="#0e1318" opacity="0.18" stroke="none"/>
      <!-- Pista 2 (marcada en rojo) -->
      <rect id="pista-roja" x="100" y="408" width="455" height="40" rx="3" fill="url(#g-track-red)" stroke="#8f1f24"/>

      <rect x="100" y="427" width="455" height="5" fill="#0e1318" opacity="0.18" stroke="none"/>
      <rect x="100" y="432" width="455" height="40" rx="3" fill="url(#g-track)" stroke="#2f5a9e"/>

      <rect x="100" y="451" width="455" height="5" fill="#0e1318" opacity="0.18" stroke="none"/>
      <rect x="100" y="456" width="455" height="40" rx="3" fill="url(#g-track)" stroke="#2f5a9e"/>

      <rect x="100" y="475" width="455" height="5" fill="#0e1318" opacity="0.18" stroke="none"/>
      <rect x="100" y="480" width="455" height="40" rx="3" fill="url(#g-track)" stroke="#2f5a9e"/>
    </g>

    <g font-size="11" fill="#5b6672" text-anchor="end">
      <text x="90" y="400">Pista 1</text>
      <text x="90" y="424" fill="#d6363d" font-weight="700">Pista 2</text>
      <text x="90" y="448">Pista 3</text>
      <text x="90" y="472">Pista 4</text>
      <text x="90" y="504">Pista 5</text>
    </g>

    <!-- Flecha roja hacia las pistas vecinas (las siguientes) -->
    <g id="flecha-vecinas" fill="none" stroke="#d6363d" stroke-width="3">
      <path d="M559 428 H588 V500"/>
      <path d="M588 452 H563" marker-end="url(#head-red)"/>
      <path d="M588 476 H563" marker-end="url(#head-red)"/>
      <path d="M588 500 H563" marker-end="url(#head-red)"/>
    </g>
    <circle cx="559" cy="428" r="4" fill="#d6363d"/>

    <!-- Nota -->
    <rect x="602" y="436" width="238" height="60" rx="8" fill="#fdecec" stroke="#d6363d" stroke-width="1.3"/>
    <g font-size="12.5" font-weight="600" fill="#a3242a">
      <text x="616" y="462">“Reescribir esta pista obliga a</text>
      <text x="616" y="480">reescribir las siguientes”</text>
    </g>
  </g>
</svg>
