<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Figura 2: Tiempo de acceso</title>
  <desc id="d">Plato visto desde arriba con cuatro pistas concéntricas, una pista objetivo resaltada y un sector marcado sobre ella. El brazo y el cabezal están en el borde exterior apuntando al centro. Tres flechas muestran el tiempo de acceso: Seek (azul, radial), latencia rotacional (naranja, curva sobre la pista) y transferencia (verde, corta sobre el sector). Una flecha circular indica el sentido de giro. Debajo, la fórmula T_acceso = Seek + Latencia + Transferencia.</desc>

  <defs>
    <linearGradient id="g-platter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d9e1e8"/>
      <stop offset="0.65" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#b9c4ce"/>
    </linearGradient>
    <radialGradient id="g-hub" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#5b6672"/>
      <stop offset="1" stop-color="#1f2730"/>
    </radialGradient>
    <linearGradient id="g-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8794a1"/>
      <stop offset="1" stop-color="#55616d"/>
    </linearGradient>

    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2b7de9"/>
    </marker>
    <marker id="head-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e8770e"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e9e5b"/>
    </marker>
    <marker id="head-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4a5662"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="880" height="760" fill="#f7f9fb"/>

  <!-- Título -->
  <text x="40" y="32" font-size="18" font-weight="700" fill="#1f2730">Figura 2: Tiempo de acceso</text>
  <text x="270" y="32" font-size="13" fill="#5b6672">Vista cenital de un plato</text>

  <!-- ============ PLATO Y PISTAS ============ -->
  <g id="plato">
    <circle cx="440" cy="350" r="250" fill="url(#g-platter)" stroke="#7d8996" stroke-width="2"/>

    <!-- Pistas concéntricas -->
    <g id="pistas" fill="none" stroke="#7d8996" stroke-width="1.2" opacity="0.6">
      <circle cx="440" cy="350" r="230"/>
      <circle cx="440" cy="350" r="190"/>
      <circle cx="440" cy="350" r="150"/>
      <circle cx="440" cy="350" r="110"/>
    </g>

    <!-- Pista objetivo resaltada -->
    <circle id="pista-objetivo" cx="440" cy="350" r="150" fill="none" stroke="#f5c542" stroke-width="22" opacity="0.5"/>
    <circle cx="440" cy="350" r="161" fill="none" stroke="#c99a12" stroke-width="1"/>
    <circle cx="440" cy="350" r="139" fill="none" stroke="#c99a12" stroke-width="1"/>

    <!-- Sector objetivo (118° a 136° sobre la pista) -->
    <path id="sector-objetivo" d="M324.18 461.84 A161 161 0 0 0 364.42 492.16 L374.74 472.73 A139 139 0 0 1 340.01 446.56 Z" fill="#8b5cd6" stroke="#5b34a5" stroke-width="1.2" opacity="0.92"/>
  </g>

  <!-- ============ EJE ============ -->
  <g id="eje">
    <circle cx="440" cy="350" r="50" fill="#9aa7b4" stroke="#5b6672" stroke-width="1.5"/>
    <circle cx="440" cy="350" r="26" fill="url(#g-hub)" stroke="#1f2730" stroke-width="1.5"/>
    <circle cx="440" cy="350" r="8" fill="#9aa7b4" stroke="#1f2730" stroke-width="1"/>
  </g>

  <!-- ============ BRAZO Y CABEZAL (borde exterior, apuntando al centro) ============ -->
  <g id="brazo-cabezal">
    <path d="M95 342 L45 325 L45 375 L95 358 Z" fill="#c98a4b" stroke="#8a5a2a" stroke-width="1.2"/>
    <path d="M95 342 L190 347 L205 348 L205 352 L190 353 L95 358 Z" fill="url(#g-arm)" stroke="#3d4853" stroke-width="1.5"/>
    <circle cx="95" cy="350" r="14" fill="#9aa7b4" stroke="#3d4853" stroke-width="1.5"/>
    <circle cx="95" cy="350" r="5" fill="#2f3944"/>
    <rect id="cabezal" x="196" y="343" width="14" height="14" rx="2" fill="#e5484d" stroke="#8f1f24" stroke-width="1.2"/>
    <g font-size="11" fill="#4a5662" font-weight="600" stroke="#f7f9fb" stroke-width="3" paint-order="stroke" text-anchor="middle">
      <text x="120" y="394">Brazo</text>
      <text x="208" y="394">Cabezal</text>
    </g>
  </g>

  <!-- ============ FLECHAS DEL TIEMPO DE ACCESO ============ -->
  <g id="flechas" fill="none" stroke-width="4" stroke-linecap="butt">
    <!-- 1. Seek: radial, del cabezal a la pista objetivo -->
    <line id="flecha-seek" x1="216" y1="350" x2="288" y2="350" stroke="#2b7de9" marker-end="url(#head-blue)"/>
    <!-- 2. Latencia rotacional: curva sobre la pista, del cabezal al sector -->
    <path id="flecha-latencia" d="M290 350 A150 150 0 0 0 331.2 453.25" stroke="#e8770e" marker-end="url(#head-orange)"/>
    <!-- 3. Transferencia: corta, sobre el sector -->
    <path id="flecha-transferencia" d="M333.9 456.1 A150 150 0 0 0 367.3 481.7" stroke="#2e9e5b" marker-end="url(#head-green)"/>
  </g>

  <!-- ============ SENTIDO DE GIRO ============ -->
  <g id="giro">
    <path d="M487.2 82.1 A272 272 0 0 1 695.6 257" fill="none" stroke="#4a5662" stroke-width="3" marker-end="url(#head-gray)"/>
    <text x="650" y="128" font-size="13" font-weight="600" fill="#1f2730">Sentido de giro</text>
    <text x="650" y="145" font-size="12" fill="#5b6672">7.200 RPM</text>
  </g>

  <!-- ============ ETIQUETAS Y LÍNEAS DE GUÍA ============ -->
  <g id="etiquetas">
    <!-- Seek -->
    <polyline points="140,309 252,348" fill="none" stroke="#2b7de9" stroke-width="1.3"/>
    <circle cx="252" cy="348" r="3" fill="#2b7de9"/>
    <circle cx="46" cy="300" r="9" fill="#2b7de9"/>
    <text x="46" y="304" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="62" y="305" font-size="15" font-weight="600" fill="#1b5fb8">Seek (8-12 ms)</text>

    <!-- Latencia rotacional -->
    <polyline points="210,463 300.9,406.2" fill="none" stroke="#e8770e" stroke-width="1.3"/>
    <circle cx="300.9" cy="406.2" r="3" fill="#e8770e"/>
    <circle cx="46" cy="470" r="9" fill="#e8770e"/>
    <text x="46" y="474" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="62" y="475" font-size="14" font-weight="600" fill="#b3590a">Latencia rotacional</text>
    <text x="62" y="493" font-size="13" fill="#b3590a">(4,17 ms a 7.200 RPM)</text>

    <!-- Transferencia -->
    <polyline points="170,562 343,478.6" fill="none" stroke="#2e9e5b" stroke-width="1.3"/>
    <circle cx="343" cy="478.6" r="3" fill="#2e9e5b"/>
    <circle cx="46" cy="560" r="9" fill="#2e9e5b"/>
    <text x="46" y="564" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="62" y="565" font-size="14" font-weight="600" fill="#1f7a45">Transferencia</text>
    <text x="62" y="583" font-size="13" fill="#1f7a45">(sobre el sector)</text>

    <!-- Pista objetivo -->
    <polyline points="590,350 708,350" fill="none" stroke="#7a5a00" stroke-width="1.3"/>
    <circle cx="590" cy="350" r="3" fill="#7a5a00"/>
    <text x="716" y="355" font-size="14" font-weight="600" fill="#7a5a00">Pista objetivo</text>
  </g>

  <!-- ============ FÓRMULA ============ -->
  <g id="formula">
    <rect x="140" y="650" width="600" height="56" rx="10" fill="#ffffff" stroke="#8a97a4" stroke-width="1.5"/>
    <text x="440" y="685" font-size="20" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" fill="#1f2730">T<tspan font-size="14" dy="5">acceso</tspan><tspan dy="-5"> = </tspan><tspan fill="#1b5fb8">Seek</tspan> + <tspan fill="#b3590a">Latencia</tspan> + <tspan fill="#1f7a45">Transferencia</tspan></text>
    <text x="440" y="734" font-size="11" fill="#5b6672" text-anchor="middle">Las flechas 2 y 3 se dibujan en el sistema de referencia del plato: el cabezal permanece fijo y el plato gira.</text>
  </g>
</svg>
